<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14213d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Memória de Números</title>
<style>
* { box-sizing: border-box; }
body { margin:0; padding:16px 10px 28px; background:#0b132b; color:#fff; font-family:Arial,Helvetica,sans-serif; }
.app { width:100%; max-width:560px; margin:0 auto; }
header { text-align:center; margin:5px 0 16px; }
h1 { font-size:30px; margin:0 0 8px; }
.subtitle { color:#d7e2fa; font-size:15px; line-height:1.5; }
.panel { margin:12px 0; padding:16px; background:#172344; border:1px solid #344a75; border-radius:18px; }
.progress { display:flex; justify-content:center; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
.stage { border:1px solid #43577e; border-radius:9px; padding:7px 10px; color:#d7e2fa; background:#1a2a4c; font-weight:bold; cursor:pointer; user-select:none; }
.stage:active { transform:scale(.96); }
.stage.current { background:#245ca5; border-color:#75b8ff; color:#fff; }
.stage.done { background:#146746; border-color:#39d98a; color:#fff; }
.status { text-align:center; min-height:24px; font-weight:bold; color:#d7e2fa; line-height:1.4; }
.sequence-box { display:flex; justify-content:center; align-items:center; min-height:110px; margin:12px 0; padding:12px 8px; border-radius:14px; background:#09132b; border:1px solid #32486f; }
.sequence { font-size:clamp(30px, 8vw, 45px); font-weight:900; text-align:center; line-height:1.55; letter-spacing:3px; overflow-wrap:anywhere; }
.instruction { text-align:center; min-height:24px; line-height:1.5; color:#d7e2fa; font-size:14px; margin:8px 0; }
.entry { min-height:40px; text-align:center; font-size:29px; font-weight:bold; letter-spacing:5px; overflow-wrap:anywhere; padding:4px; }
.entry.empty { color:#7285ad; }
.counter { text-align:center; font-size:13px; color:#d7e2fa; margin:4px 0 12px; }
.keypad { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; max-width:390px; margin:0 auto; }
button { font-family:inherit; cursor:pointer; touch-action:manipulation; }
.key { min-height:54px; background:#294574; color:#fff; border:1px solid #55709d; border-radius:12px; font-weight:bold; font-size:24px; }
.key:active { background:#4268a5; }
.key:disabled { opacity:.38; cursor:default; }
.utility { font-size:14px; background:#263858; }
.zero { grid-column:2; }
.actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
.action { flex:1; min-width:135px; min-height:48px; padding:11px 12px; border:0; border-radius:12px; color:#fff; font-weight:bold; font-size:15px; }
.primary { background:#176de0; }
.secondary { background:#304263; border:1px solid #526a92; }
.green { background:#11845a; }
.action:disabled { opacity:.4; cursor:default; }
.message { text-align:center; color:#d7e2fa; line-height:1.5; min-height:42px; padding-top:10px; }
.message.good { color:#65f0ad; font-weight:bold; }
.message.bad { color:#ff9ba5; font-weight:bold; }
#resultActions[hidden] { display:none !important; }
@media(max-width:390px) { .panel { padding:12px; } .stage { padding:7px 8px; } .key { min-height:50px; } h1 { font-size:27px; } }

/* Upgrade de tela: botões maiores e melhor aproveitamento da altura do iPhone */
html { min-height: 100%; }
body { min-height: 100vh; min-height: 100dvh; padding: max(8px, env(safe-area-inset-top)) 8px max(12px, env(safe-area-inset-bottom)); }
.app { min-height: calc(100vh - 20px); min-height: calc(100dvh - 20px); display: flex; flex-direction: column; }
header { margin: 2px 0 8px; }
h1 { font-size: 24px; margin: 0; }
.panel { flex: 1; display: flex; flex-direction: column; margin: 4px 0 0; padding: 11px; border-radius: 14px; }
.progress { gap: 5px; margin-bottom: 8px; }
.stage { padding: 5px 8px; font-size: 12px; border-radius: 8px; }
.status { min-height: 20px; font-size: 13px; }
.sequence-box { min-height: 68px; margin: 8px 0; padding: 8px; border-radius: 11px; }
.sequence { font-size: clamp(27px, 7.5vw, 39px); line-height: 1.3; letter-spacing: 2px; }
.instruction { min-height: 20px; font-size: 13px; line-height: 1.3; margin: 5px 0; }
.entry { min-height: 36px; font-size: 25px; letter-spacing: 3px; padding: 3px; }
.counter { font-size: 12px; margin: 3px 0 8px; }
.keypad { gap: 7px; width: 100%; max-width: 430px; }
.key { min-height: clamp(46px, 6.7vh, 58px); border-radius: 10px; font-size: 23px; }
.utility { font-size: 14px; }
.actions { gap: 7px; margin-top: 10px; justify-content: stretch; }
.action { flex: 1 1 0; min-width: 0; min-height: 44px; padding: 9px 8px; border-radius: 10px; font-size: 14px; }
.message { min-height: 30px; padding-top: 7px; font-size: 13px; line-height: 1.35; }
@media(max-width:390px) {
  .panel { padding: 9px; }
  h1 { font-size: 22px; }
  .stage { padding: 5px 6px; font-size: 11px; }
  .key { min-height: clamp(44px, 6.4vh, 54px); }
  .sequence-box { min-height: 62px; }
}
@media(max-height:700px) {
  .sequence-box { min-height: 56px; margin: 5px 0; }
  .instruction { margin: 3px 0; }
  .entry { min-height: 30px; }
  .counter { margin-bottom: 5px; }
  .key { min-height: 43px; }
  .actions { margin-top: 7px; }
  .message { min-height: 24px; padding-top: 4px; }
}

</style>
</head>
<body>
<main class="app">
<header>
  <h1>🧠 Memória de Números</h1>
</header>
<section class="panel">
  <div class="progress" id="progress">
    <span class="stage current" data-stage="4">4</span><span class="stage" data-stage="5">5</span><span class="stage" data-stage="6">6</span><span class="stage" data-stage="7">7</span><span class="stage" data-stage="8">8</span><span class="stage" data-stage="9">9</span><span class="stage" data-stage="10">10</span>
  </div>
  <div class="status" id="status">O jogo está carregando…</div>
  <div class="sequence-box"><div class="sequence" id="sequence">Pronto?</div></div>
  <div class="instruction" id="instruction">Clique em “Mostrar números” para começar.</div>
  <div class="entry empty" id="entry">— — — —</div>
  <div class="counter" id="counter">0 de 4 números digitados</div>
  <div class="keypad" id="keypad">
    <button class="key" type="button" data-digit="1" disabled>1</button><button class="key" type="button" data-digit="2" disabled>2</button><button class="key" type="button" data-digit="3" disabled>3</button>
    <button class="key" type="button" data-digit="4" disabled>4</button><button class="key" type="button" data-digit="5" disabled>5</button><button class="key" type="button" data-digit="6" disabled>6</button>
    <button class="key" type="button" data-digit="7" disabled>7</button><button class="key" type="button" data-digit="8" disabled>8</button><button class="key" type="button" data-digit="9" disabled>9</button>
    <button class="key utility" type="button" id="backspace" disabled>⌫ Apagar</button><button class="key zero" type="button" data-digit="0" disabled>0</button><button class="key utility" type="button" id="clear" disabled>Limpar</button>
  </div>
  <div class="actions">
    <button type="button" class="action primary" id="start" onclick="startGame()">🔢 Mostrar números</button>
    <button type="button" class="action secondary" id="submit" onclick="checkAnswer()" disabled>✓ Confirmar</button>
  </div>
  <div class="actions" id="resultActions" hidden>
    <button type="button" class="action green" id="next" onclick="nextChallenge()">Próximo desafio</button>
    <button type="button" class="action secondary" id="retry" onclick="retryChallenge()">Tentar novamente</button>
  </div>
  <div class="message" id="message">Carregando o jogo…</div>
</section>
</main>
<script>
var stage = 4;
var sequence = '';
var entered = '';
var state = 'ready';
var showTimer = null;
var best = 0;

function el(id) { return document.getElementById(id); }
function say(text, kind) {
  el('message').className = 'message' + (kind ? ' ' + kind : '');
  el('message').textContent = text;
}
function setKeys(enabled) {
  var keys = document.querySelectorAll('[data-digit]');
  for (var i = 0; i < keys.length; i++) keys[i].disabled = !enabled;
  el('backspace').disabled = !enabled || entered.length === 0;
  el('clear').disabled = !enabled || entered.length === 0;
  el('submit').disabled = !enabled || entered.length !== stage;
}
function showEntry() {
  if (entered.length) {
    el('entry').textContent = entered.split('').join(' ');
    el('entry').className = 'entry';
  } else {
    el('entry').textContent = new Array(stage + 1).join('— ').trim();
    el('entry').className = 'entry empty';
  }
  el('counter').textContent = entered.length + ' de ' + stage + ' números digitados';
  setKeys(state === 'input');
}
function updateStages() {
  var badges = document.querySelectorAll('[data-stage]');
  for (var i = 0; i < badges.length; i++) {
    var n = Number(badges[i].getAttribute('data-stage'));
    badges[i].className = 'stage';
    if (n === stage) badges[i].className += ' current';
    if (n < stage || (state === 'finished' && n <= 10)) badges[i].className += ' done';
  }
  el('status').textContent = state === 'finished' ? 'Parabéns! Você completou todos os níveis!' : 'Desafio de ' + stage + ' números';
}
function resetChallenge(text) {
  if (showTimer !== null) { window.clearTimeout(showTimer); showTimer = null; }
  state = 'ready'; sequence = ''; entered = '';
  el('sequence').textContent = 'Pronto?';
  el('instruction').textContent = 'Clique em “Mostrar números” para começar.';
  el('resultActions').hidden = true;
  el('start').disabled = false;
  el('start').textContent = '🔢 Mostrar números';
  el('submit').disabled = true;
  showEntry();
  say(text || 'Memorize os números e digite-os na mesma ordem.');
  updateStages();
}

function selectStage(level) {
  if (level < 4 || level > 10) return;
  stage = level;
  resetChallenge('Nível ' + stage + ' selecionado. Clique em “Mostrar números” para começar.');
}

function startGame() {
  if (showTimer !== null) { window.clearTimeout(showTimer); showTimer = null; }
  if (state === 'finished') stage = 4;
  sequence = '';
  for (var i = 0; i < stage; i++) sequence += String(Math.floor(Math.random() * 10));
  entered = '';
  state = 'showing';
  el('sequence').textContent = sequence.split('').join('   ');
  el('instruction').textContent = 'Memorize a ordem dos números…';
  el('resultActions').hidden = true;
  el('start').disabled = true;
  el('start').textContent = 'Observe os números…';
  el('submit').disabled = true;
  showEntry();
  setKeys(false);
  say('Observe com atenção. Os números vão desaparecer em alguns segundos.');
  updateStages();
  showTimer = window.setTimeout(function () {
    showTimer = null;
    state = 'input';
    entered = '';
    el('sequence').textContent = new Array(stage + 1).join('● ').trim();
    el('instruction').textContent = 'Agora digite os números na mesma ordem.';
    el('start').textContent = 'Digite a sequência';
    showEntry();
    setKeys(true);
    updateStages();
  }, 4500 + (stage - 4) * 450);
}
function pressDigit(digit) {
  if (state !== 'input' || entered.length >= stage) return;
  entered += String(digit);
  showEntry();
  if (entered.length === stage) el('instruction').textContent = 'Todos digitados. Clique em “Confirmar”.';
}
function eraseLast() {
  if (state !== 'input' || !entered.length) return;
  entered = entered.slice(0, -1);
  showEntry();
  el('instruction').textContent = 'Digite os números na mesma ordem.';
}
function clearEntry() {
  if (state !== 'input') return;
  entered = '';
  showEntry();
  el('instruction').textContent = 'Digite os números na mesma ordem.';
}
function checkAnswer() {
  if (state !== 'input' || entered.length !== stage) return;
  setKeys(false);
  el('resultActions').hidden = false;
  el('sequence').textContent = sequence.split('').join('   ');
  el('start').disabled = true;
  if (entered === sequence) {
    if (stage > best) best = stage;
    if (stage === 10) {
      state = 'finished';
      el('instruction').textContent = 'Você concluiu todos os níveis.';
      say('🎉 Excelente! Você acertou os 10 números e completou o jogo!', 'good');
      el('resultActions').hidden = true;
      el('start').disabled = false;
      el('start').textContent = '↻ Jogar novamente desde 4';
    } else {
      state = 'correct';
      el('instruction').textContent = 'Resposta correta! Avance quando estiver pronto.';
      el('next').textContent = 'Próximo desafio (' + (stage + 1) + ')';
      el('retry').textContent = 'Repetir nível ' + stage;
      say('Muito bem! Você acertou os ' + stage + ' números.', 'good');
    }
  } else {
    state = 'wrong';
    el('instruction').textContent = 'A sequência correta está mostrada acima. Tente outra vez.';
    el('next').textContent = 'Tentar novamente';
    el('retry').textContent = 'Reiniciar nível ' + stage;
    say('Quase! Memorize a sequência correta e tente novamente.', 'bad');
  }
  updateStages();
}
function nextChallenge() {
  if (state === 'correct' && stage < 10) stage++;
  resetChallenge(state === 'wrong' ? 'Vamos tentar de novo no nível ' + stage + '.' : 'Novo desafio: memorize ' + stage + ' números.');
}
function retryChallenge() {
  resetChallenge('Vamos tentar novamente com ' + stage + ' números.');
}
function handleKeyboard(event) {
  if (event.key >= '0' && event.key <= '9' && event.key.length === 1) pressDigit(event.key);
  else if (event.key === 'Backspace') eraseLast();
  else if (event.key === 'Enter') checkAnswer();
}

(function initialize() {
  var badges = document.querySelectorAll('[data-stage]');
  for (var j = 0; j < badges.length; j++) {
    badges[j].onclick = function () { selectStage(Number(this.getAttribute('data-stage'))); };
    badges[j].setAttribute('role', 'button');
    badges[j].setAttribute('tabindex', '0');
    badges[j].onkeydown = function (event) { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); selectStage(Number(this.getAttribute('data-stage'))); } };
  }
  var keys = document.querySelectorAll('[data-digit]');
  for (var i = 0; i < keys.length; i++) {
    keys[i].onclick = function () { pressDigit(this.getAttribute('data-digit')); };
  }
  el('backspace').onclick = eraseLast;
  el('clear').onclick = clearEntry;
  document.addEventListener('keydown', handleKeyboard);
  showEntry();
  updateStages();
  setKeys(false);
  say('Jogo carregado. Clique em “Mostrar números” para começar.');
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function (err) {
      console.log('Não foi possível registrar o modo offline:', err);
    });
  });
}
</script>
</body>
</html>
